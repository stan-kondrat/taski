# Tests on every push and pull request; deploys GitHub Pages from main.
# No project dependencies: system python3, the runner's preinstalled Chrome,
# plain shell, and GitHub's own Pages actions.
name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python tests (server.py)
        run: python3 -m unittest discover tests -v

      - name: JavaScript tests (headless Chrome)
        run: scripts/run-js-tests.sh google-chrome

      - name: Build downloads
        run: python3 scripts/build-dist.py dist

      - name: Single file opens from disk (headless Chrome)
        run: scripts/check-single-file.sh dist google-chrome

      - name: Build site
        run: scripts/build-site.sh _site

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: scripts/build-site.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
